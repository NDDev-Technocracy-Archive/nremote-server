name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: The commitlint exemption is not wider than stated
      run: node scripts/check_commitlint_config.mjs
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --component clippy,rustfmt
        echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
    - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/hosted-cache@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
      with:
        ecosystems: cargo
    - name: Format
      shell: bash
      run: |
        printf 'pub const VERSION: &str = "0.0.0";\n' > src/version.rs && cargo fmt --all --check
    - name: Clippy
      shell: bash
      run: |
        cargo clippy --locked --all-targets -- -D warnings
    - name: Build
      shell: bash
      run: |
        cargo build --locked --all-targets
    - name: Test
      shell: bash
      run: |
        cargo test --locked --all-targets
  rust-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-26
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
    - name: Test
      shell: bash
      run: |
        cargo test --locked --all-targets
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
    - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
      with:
        capability: rust
    - name: Supply chain
      shell: bash
      run: |
        (cd . && cargo audit)

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github/workflows/ci.yml .github/workflows/image.yml .github/workflows/security.yml .github/workflows/codeql-scorecard.yml .github/dependabot.yml
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

