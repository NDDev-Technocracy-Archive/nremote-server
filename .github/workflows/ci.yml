name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Prepare the job
      uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
      with:
        managed: false
    - name: The commitlint exemption is not wider than stated
      run: just test-contracts
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
      with:
        managed: false
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --component clippy,rustfmt
        echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
    - name: Format
      shell: bash
      run: |
        just test-format
    - name: Clippy
      shell: bash
      run: |
        just lint-rust
    - name: Build
      shell: bash
      run: |
        just build
    - name: Test
      shell: bash
      run: |
        just test
  rust-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-26
    defaults:
      run:
        shell: bash
    steps:
    - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
      with:
        managed: false
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
    - name: Test
      shell: bash
      run: |
        just test
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
      with:
        managed: false
    - name: Prepare the declared audit tool
      uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
      with:
        managed: false
        tools: cargo-audit@0.23.0
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
    - name: Supply chain
      shell: bash
      run: |
        just audit-dependencies

  workflows:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      recipe: check
      tool-assets: .github/source-tools.json
      timeout-minutes: 10

  secrets:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      recipe: scan-secrets
      arguments: ${{ format('["{0}"]', github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all') }}
      tool-assets: .github/secret-tools.json
      fetch-depth: 0
      timeout-minutes: 10

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read
