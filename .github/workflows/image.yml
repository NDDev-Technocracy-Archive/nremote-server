name: image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
      push: ${{ steps.plan.outputs.push }}
      cache: ${{ steps.plan.outputs.cache }}
    steps:
    - name: Decide what this event publishes
      id: plan
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        EVENT: ${{ github.event_name }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        short="${SHA:0:12}"
        if [ "$REF_TYPE" = "tag" ]; then
          # A tag is the only thing that moves :latest. A push to main does
          # not, because main is where work lands, not where it is blessed.
          tags="$REF_NAME,latest,sha-$short"
          push=true
        elif [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; then
          tags="main,sha-$short"
          push=true
        else
          tags="pr-${{ github.event.number }}"
          push=false
        fi
        # The registry layer cache is written with the same credential that
        # pushes, so a pull request -- which has none, and from a fork could
        # not be trusted with one -- uses the Actions cache instead.
        if [ "$push" = "true" ]; then cache=registry; else cache=gha; fi
        {
          printf 'tags=%s\n' "$tags"
          printf 'push=%s\n' "$push"
          printf 'cache=%s\n' "$cache"
        } >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build the image without pushing
      shell: bash
      run: |
        docker build --platform linux/amd64 -f Dockerfile .
